# Termote's Herdr plugin. Every command runs the `termote` binary, which must
# be on PATH (`termote link`); the logic lives there, so the plugin needs no
# runtime of its own. Action output only reaches the plugin log, so what the
# user has to read is shown in the `panel` popup.
id = "lamngockhuong.termote"
name = "Termote"
version = "1.5.0" # x-release-please-version
# `placement = "popup"` needs Herdr 0.7.4.
min_herdr_version = "0.7.4"
description = "Open the focused Herdr pane in Termote from a phone or browser: link, QR code, copy, and start or stop the server"
platforms = ["linux", "macos", "windows"]

[[panes]]
id = "panel"
title = "Termote"
placement = "popup"
width = "80%"
height = "90%"
command = ["termote", "panel"]

# Key bindings can only run actions, so this action opens the panel.
[[actions]]
id = "panel"
title = "Termote: show the link, QR code and server controls"
contexts = ["pane", "workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "lamngockhuong.termote", "--entrypoint", "panel"]

[[actions]]
id = "open"
title = "Termote: open this pane in the browser"
contexts = ["pane", "workspace"]
command = ["termote", "url", "--herdr", "--open"]

[[actions]]
id = "copy"
title = "Termote: copy the link to this pane"
contexts = ["pane", "workspace"]
command = ["termote", "url", "--herdr", "--copy"]

[[actions]]
id = "start"
title = "Termote: start the server"
contexts = ["pane", "workspace"]
command = ["termote", "start"]

[[actions]]
id = "stop"
title = "Termote: stop the server"
contexts = ["pane", "workspace"]
command = ["termote", "stop"]

[[actions]]
id = "restart"
title = "Termote: restart the server"
contexts = ["pane", "workspace"]
command = ["termote", "restart"]
