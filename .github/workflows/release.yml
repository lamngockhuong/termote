name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (skip push to registries)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version from release-please"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Prepare: Extract version and create tag if manual trigger
  # ─────────────────────────────────────────────────────────────

  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          # inputs.version is set when called via workflow_call or workflow_dispatch
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            DRY_RUN="${{ inputs.dry_run || 'false' }}"
          else
            # Tag push trigger (refs/tags/v1.2.3)
            VERSION="${GITHUB_REF#refs/tags/v}"
            DRY_RUN="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (dry_run: $DRY_RUN)"

  # ─────────────────────────────────────────────────────────────
  # Build Jobs (parallel)
  # ─────────────────────────────────────────────────────────────

  build-pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter termote...

      - name: Build
        working-directory: pwa
        run: pnpm build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pwa-dist
          path: pwa/dist
          retention-days: 1

  # Every binary embeds the PWA (server/webui), so each build waits for it.
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [prepare, build-pwa]
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Download PWA build
        uses: actions/download-artifact@v8
        with:
          name: pwa-dist
          path: server/webui/dist

      - name: Check the PWA build is in place
        run: test -f server/webui/dist/index.html || { echo "::error::server/webui/dist/index.html missing; the binary would embed the placeholder page"; exit 1; }

      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="termote-${VERSION}-${GOOS}-${GOARCH}"
          exe=termote
          [ "$GOOS" = windows ] && exe=termote.exe
          mkdir -p "pkg/$name/bin" out
          # The version comes from the tag, whatever server/cli_version.go says.
          (cd server && go build -ldflags="-s -w -X main.cliVersion=${VERSION}" -o "../pkg/$name/bin/$exe" .)
          if [ "$GOOS" = linux ] && [ "$GOARCH" = amd64 ]; then
            got=$("pkg/$name/bin/$exe" version)
            [ "$got" = "Termote v${VERSION}" ] || { echo "::error::binary reports '$got', expected v${VERSION}"; exit 1; }
          fi
          cp LICENSE "pkg/$name/"
          if [ "$GOOS" = windows ]; then
            archive="$name.zip"
            (cd pkg && zip -qr "../out/$archive" "$name")
          else
            archive="$name.tar.gz"
            tar -C pkg -czf "out/$archive" "$name"
          fi
          (cd out && sha256sum "$archive" > "$archive.sha256")
          # The image build copies the Linux binaries as they are.
          if [ "$GOOS" = linux ]; then
            cp "pkg/$name/bin/termote" "out/termote-linux-$GOARCH"
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: termote-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Docker Build & Push (depends on all builds)
  # ─────────────────────────────────────────────────────────────

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare build context
        run: |
          # termote binaries with the PWA embedded (both architectures)
          cp artifacts/termote-linux-amd64/termote-linux-amd64 server/termote-linux-amd64
          cp artifacts/termote-linux-arm64/termote-linux-arm64 server/termote-linux-arm64
          chmod +x server/termote-linux-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (all-in-one)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
            type=raw,value=${{ needs.prepare.outputs.version }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # GitHub Release (depends on docker)
  # ─────────────────────────────────────────────────────────────

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, docker, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # One archive per platform with its .sha256; the loose Linux
          # binaries only feed the image build.
          find artifacts -type f \( -name 'termote-*.tar.gz' -o -name 'termote-*.zip' -o -name '*.sha256' \) -exec cp {} release/ \;
          test "$(ls release/*.tar.gz release/*.zip | wc -l)" -eq 5 || { ls -l release; echo "::error::expected 5 archives"; exit 1; }
          # Each archive holds <name>/bin/termote[.exe] and <name>/LICENSE.
          for f in release/*.tar.gz release/*.zip; do
            name=$(basename "$f"); name=${name%.tar.gz}; name=${name%.zip}
            exe=termote; case "$name" in *windows*) exe=termote.exe ;; esac
            if [ "${f%.zip}" != "$f" ]; then list=$(unzip -Z1 "$f"); else list=$(tar -tzf "$f"); fi
            for want in "$name/bin/$exe" "$name/LICENSE"; do
              echo "$list" | grep -qx "$want" || { echo "::error::$f misses $want"; exit 1; }
            done
          done
          (cd release && cat *.sha256 > checksums.txt)

      # A dry run stops here, after the asset checks above.
      - name: Create Release
        if: needs.prepare.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          # A version with "-" (1.0.0-rc.1) is a pre-release.
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.prepare.outputs.version, '-') }}
          files: |
            release/termote-*.tar.gz
            release/termote-*.zip
            release/*.sha256
            release/checksums.txt

  # ─────────────────────────────────────────────────────────────
  # Sync Version to package.json (skip if release-please handles it)
  # ─────────────────────────────────────────────────────────────

  sync-version:
    name: Sync package.json version
    runs-on: ubuntu-latest
    needs: [prepare, release]
    # Skip when called by release-please (it handles version sync via extra-files)
    # Use inputs.version to detect workflow_call since event_name check is unreliable.
    # Skip pre-releases too: they must not bump the version on main.
    if: inputs.version == '' && !contains(needs.prepare.outputs.version, '-')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package.json
        working-directory: pwa
        run: |
          npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pwa/package.json
          git commit -m "chore: bump version to ${{ needs.prepare.outputs.version }}"
          git push origin main

  # ─────────────────────────────────────────────────────────────
  # Sync README to Docker Hub
  # ─────────────────────────────────────────────────────────────

  dockerhub-readme:
    name: Update Docker Hub README
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: lamngockhuong/termote
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
