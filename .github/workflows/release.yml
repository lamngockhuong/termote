name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (skip push to registries)"
        required: false
        type: boolean
        default: false

# Read-only by default; the jobs that publish ask for what they write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Prepare: Extract version and create tag if manual trigger
  # ─────────────────────────────────────────────────────────────

  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Inputs reach the script through env, never pasted into it: a tag or
      # an input holding $(...) must not run. Every later job gets a version
      # checked here.
      - name: Extract version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          # inputs.version is set by workflow_dispatch (release-please starts it so)
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            DRY_RUN="$INPUT_DRY_RUN"
          else
            # Tag push trigger (refs/tags/v1.2.3)
            VERSION="${GITHUB_REF#refs/tags/v}"
            DRY_RUN="false"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$VERSION' is not X.Y.Z[-pre]"
            exit 1
          fi
          [ "$DRY_RUN" = true ] || DRY_RUN=false
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (dry_run: $DRY_RUN)"

  # ─────────────────────────────────────────────────────────────
  # Build Jobs (parallel)
  # ─────────────────────────────────────────────────────────────

  build-pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      # No cache in release jobs: they run in the main ref like CI, and
      # any CI job on main can write the cache entries they would restore.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter termote...

      - name: Build
        working-directory: pwa
        run: pnpm build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-dist
          path: pwa/dist
          retention-days: 1

  # Every binary embeds the PWA (server/webui), so each build waits for it.
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [prepare, build-pwa]
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false

      - name: Download PWA build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwa-dist
          path: server/webui/dist

      - name: Check the PWA build is in place
        run: test -f server/webui/dist/index.html || { echo "::error::server/webui/dist/index.html missing; the binary would embed the placeholder page"; exit 1; }

      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="termote-${VERSION}-${GOOS}-${GOARCH}"
          exe=termote
          [ "$GOOS" = windows ] && exe=termote.exe
          mkdir -p "pkg/$name/bin" out
          # The modules in the module cache must match go.sum before they are built in.
          (cd server && go mod verify)
          # The version comes from the tag, whatever server/cli_version.go says.
          (cd server && go build -ldflags="-s -w -X main.cliVersion=${VERSION}" -o "../pkg/$name/bin/$exe" .)
          if [ "$GOOS" = linux ] && [ "$GOARCH" = amd64 ]; then
            got=$("pkg/$name/bin/$exe" version)
            [ "$got" = "Termote v${VERSION}" ] || { echo "::error::binary reports '$got', expected v${VERSION}"; exit 1; }
          fi
          cp LICENSE "pkg/$name/"
          if [ "$GOOS" = windows ]; then
            archive="$name.zip"
            (cd pkg && zip -qr "../out/$archive" "$name")
          else
            archive="$name.tar.gz"
            tar -C pkg -czf "out/$archive" "$name"
          fi
          (cd out && sha256sum "$archive" > "$archive.sha256")
          # The image build copies the Linux binaries as they are.
          if [ "$GOOS" = linux ]; then
            cp "pkg/$name/bin/termote" "out/termote-linux-$GOARCH"
          fi

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termote-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Docker Build & Push (depends on all builds)
  # ─────────────────────────────────────────────────────────────

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    outputs:
      # The pushed image's digest: the release names it in image-digest.txt,
      # which the signature covers, and `container up` runs it by digest.
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare build context
        run: |
          # termote binaries with the PWA embedded (both architectures)
          cp artifacts/termote-linux-amd64/termote-linux-amd64 server/termote-linux-amd64
          cp artifacts/termote-linux-arm64/termote-linux-arm64 server/termote-linux-arm64
          chmod +x server/termote-linux-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (all-in-one)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
            type=raw,value=${{ needs.prepare.outputs.version }}

      - name: Build & push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────────────────────
  # GitHub Release (depends on docker)
  # ─────────────────────────────────────────────────────────────

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, docker, build]
    # The signing key lives in this environment, which waits for the
    # maintainer's approval: a release started from a pushed tag gets no
    # signature, and `termote update` refuses it.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # One archive per platform with its .sha256; the loose Linux
          # binaries only feed the image build.
          find artifacts -type f \( -name 'termote-*.tar.gz' -o -name 'termote-*.zip' -o -name '*.sha256' \) -exec cp {} release/ \;
          test "$(ls release/*.tar.gz release/*.zip | wc -l)" -eq 5 || { ls -l release; echo "::error::expected 5 archives"; exit 1; }
          # Each archive holds <name>/bin/termote[.exe] and <name>/LICENSE.
          for f in release/*.tar.gz release/*.zip; do
            name=$(basename "$f"); name=${name%.tar.gz}; name=${name%.zip}
            exe=termote; case "$name" in *windows*) exe=termote.exe ;; esac
            if [ "${f%.zip}" != "$f" ]; then list=$(unzip -Z1 "$f"); else list=$(tar -tzf "$f"); fi
            for want in "$name/bin/$exe" "$name/LICENSE"; do
              echo "$list" | grep -qx "$want" || { echo "::error::$f misses $want"; exit 1; }
            done
          done
          (cd release && cat *.sha256 > checksums.txt)

      # checksums.txt also lists image-digest.txt (the image by digest), then
      # is signed with the release key and checked against the public key
      # install.sh pins (a Go test keeps the CLI's copy equal to it). The
      # key is written to a 0600 file only for the one openssl call.
      - name: Sign the checksums
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          printf '%s\n' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$' || { echo "::error::no image digest from the docker job: '$DIGEST'"; exit 1; }
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::RELEASE_SIGNING_KEY is not set in the release environment"; exit 1; }
          echo "ghcr.io/${IMAGE_NAME}@${DIGEST}" >release/image-digest.txt
          (cd release && sha256sum image-digest.txt >>checksums.txt)
          key="$RUNNER_TEMP/release-key.pem"
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key")
          openssl pkeyutl -sign -inkey "$key" -rawin -in release/checksums.txt -out release/checksums.txt.sig
          rm -f "$key"
          sed -n "/^RELEASE_KEY='/,/^-----END PUBLIC KEY-----'/p" scripts/install.sh | sed "s/^RELEASE_KEY='//; s/'\$//" >"$RUNNER_TEMP/release-pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release-pub.pem" -rawin \
            -in release/checksums.txt -sigfile release/checksums.txt.sig ||
            { echo "::error::the signature does not verify with the key install.sh pins"; exit 1; }

      # The release is public only once every asset is on it and the image
      # is pushed (this job runs after docker): release-please creates it as
      # a draft; a tag push or a manual run creates the draft here. Then the
      # assets are uploaded and the draft is published, in that order.
      # A dry run stops before this step, after the asset checks above.
      - name: Upload the assets, then publish the release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          pre=false; latest=true
          case "$VERSION" in *-*) pre=true; latest=false ;; esac
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "$tag" --generate-notes --target "$GITHUB_SHA" --prerelease="$pre"
          fi
          gh release upload "$tag" release/termote-*.tar.gz release/termote-*.zip release/*.sha256 release/checksums.txt \
            release/checksums.txt.sig release/image-digest.txt --clobber
          count=$(gh release view "$tag" --json assets --jq '.assets | length')
          [ "$count" -ge 13 ] || { echo "::error::release $tag has $count assets, expected 13"; exit 1; }
          gh release edit "$tag" --draft=false --prerelease="$pre" --latest="$latest"

  # ─────────────────────────────────────────────────────────────
  # Sync Version to package.json (skip if release-please handles it)
  # ─────────────────────────────────────────────────────────────

  sync-version:
    name: Sync package.json version
    runs-on: ubuntu-latest
    needs: [prepare, release]
    # Only for a tag push: release-please (which dispatches this with
    # inputs.version) syncs the version itself through extra-files.
    # Skip pre-releases too: they must not bump the version on main.
    if: inputs.version == '' && !contains(needs.prepare.outputs.version, '-')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package.json
        working-directory: pwa
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version

      - name: Commit and push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pwa/package.json
          git commit -m "chore: bump version to $VERSION"
          git push origin main

  # ─────────────────────────────────────────────────────────────
  # Sync README to Docker Hub
  # ─────────────────────────────────────────────────────────────

  dockerhub-readme:
    name: Update Docker Hub README
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: lamngockhuong/termote
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md

  # ─────────────────────────────────────────────────────────────
  # Website (stable releases), once the release is public
  # ─────────────────────────────────────────────────────────────

  deploy-website:
    needs: [prepare, release]
    if: needs.prepare.outputs.dry_run != 'true' && !contains(needs.prepare.outputs.version, '-')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
    with:
      tag: v${{ needs.prepare.outputs.version }}
