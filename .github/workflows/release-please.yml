name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Nothing by default; each job asks for what it writes.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  # Trigger release workflow when release is created
  call-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # The most any job of release.yml gets: it uploads the release assets
    # and pushes the image.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Publish the website with each stable release, after its assets are out.
  # A release created with GITHUB_TOKEN does not trigger `on: release`, so
  # the deploy is called here instead.
  call-deploy-website:
    needs: [release-please, call-release]
    if: needs.release-please.outputs.release_created == 'true' && !contains(needs.release-please.outputs.version, '-')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
