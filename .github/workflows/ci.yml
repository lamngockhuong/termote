name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      pwa: ${{ steps.filter.outputs.pwa }}
      api: ${{ steps.filter.outputs.api }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docker: ${{ steps.filter.outputs.docker }}
      website: ${{ steps.filter.outputs.website }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workspace: &workspace
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            pwa:
              - *workspace
              - 'pwa/**'
            api:
              - 'server/**'
            scripts:
              - 'scripts/**'
              - 'tests/**'
              - 'Makefile'
              - 'entrypoint.sh'
            docker:
              - 'Dockerfile'
              - 'entrypoint.sh'
              - 'docker-compose.yml'
            website:
              - *workspace
              - 'website/**'
            docs:
              - 'docs/**'
              - 'dprint.json'

  build-pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    needs: changes
    # The binary embeds the PWA, so Go changes need a PWA build too (the
    # image test checks that GET / serves it)
    if: needs.changes.outputs.pwa == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter termote...

      # Audits the whole workspace lockfile (pnpm audit has no --filter)
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type check
        working-directory: pwa
        run: pnpm tsc --noEmit

      - name: Lint
        working-directory: pwa
        run: pnpm lint:ci

      - name: Unit tests
        working-directory: pwa
        run: pnpm test:coverage

      - name: Build
        working-directory: pwa
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pwa-dist
          path: pwa/dist
          retention-days: 7

  # The binary embeds the PWA; without a PWA build (only Go changed) it embeds
  # the placeholder page, which is enough for everything but the image test.
  build-api:
    name: Build server
    runs-on: ubuntu-latest
    needs: [changes, build-pwa]
    if: |
      always() && needs.build-pwa.result != 'failure' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.docker == 'true')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Download PWA build
        if: needs.build-pwa.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: pwa-dist
          path: server/webui/dist

      - name: Build
        working-directory: server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o termote-linux-amd64 .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: termote-linux-amd64
          path: server/termote-linux-amd64
          retention-days: 7

  go-test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.scripts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test ./...

      - name: Vulnerability check
        if: matrix.os == 'ubuntu-latest'
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    needs: changes
    # The shim tests also run the real CLI, so Go changes count too
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7

      # The shim tests build a stand-in binary and the real CLI with Go
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Run CLI shim tests
        run: ./tests/test-termote.sh

      - name: Run online installer tests
        run: ./tests/test-install.sh

      - name: Run entrypoint tests
        run: ./tests/test-entrypoints.sh

  # install.sh is POSIX sh; macOS has BSD tools and shasum.
  test-install-macos:
    name: Test installer (macOS)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Run online installer tests
        run: ./tests/test-install.sh

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Build termote.exe
        working-directory: server
        run: go build -ldflags="-s -w" -o termote.exe .

      - name: Verify binary
        shell: pwsh
        run: |
          if (Test-Path server/termote.exe) {
            Write-Host "termote.exe built successfully" -ForegroundColor Green
          } else {
            throw "Build failed"
          }

      # TestWindowsTaskAndStartupFallback already exits the test binary on
      # Windows (code 39, no output) on main; skipped until that is fixed.
      # bash: pwsh splits -coverprofile=cover.out at the dot (golang/go#72015)
      - name: Run Go tests
        working-directory: server
        shell: bash
        run: go test -v -coverprofile=cover.out -skip TestWindowsTaskAndStartupFallback ./...

      # Syntax is checked inside both test scripts
      - name: Run shim tests
        shell: pwsh
        run: ./tests/test-termote.ps1

      - name: Run online installer tests
        shell: pwsh
        run: ./tests/test-install.ps1

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [changes, build-pwa, build-api]
    if: |
      always() &&
      needs.build-pwa.result == 'success' &&
      needs.build-api.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Download server binary
        if: needs.build-api.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: termote-linux-amd64
          path: server

      - name: Create .htpasswd
        run: echo 'termote:$apr1$dummy$hash' > .htpasswd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: termote:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container runtime (tini, zombies, stop time)
        run: TERMOTE_TEST_IMAGE=termote:test ./tests/test-entrypoints.sh

  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.website == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @termote/website...

      - name: Build
        working-directory: website
        run: pnpm build

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting (dprint)
        run: npx dprint check
