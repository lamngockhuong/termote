name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: jobs run third-party code (dependency install scripts, dprint),
# and a write token on a push to main could push a release tag.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the API
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pwa: ${{ steps.filter.outputs.pwa }}
      api: ${{ steps.filter.outputs.api }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docker: ${{ steps.filter.outputs.docker }}
      website: ${{ steps.filter.outputs.website }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workspace: &workspace
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            pwa:
              - *workspace
              - 'pwa/**'
              # Agent transition cases and shell names, also read by the PWA tests
              - 'server/testdata/agent-transitions.json'
              - 'server/testdata/known-shells.json'
            api:
              - 'server/**'
            scripts:
              - 'scripts/**'
              - 'tests/**'
              - 'herdr-plugin/**'
              - 'Makefile'
              - 'entrypoint.sh'
            docker:
              - 'Dockerfile'
              - 'entrypoint.sh'
              - 'docker-compose.yml'
            website:
              - *workspace
              - 'website/**'
            docs:
              - 'docs/**'
              - 'dprint.json'

  build-pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    needs: changes
    # The binary embeds the PWA, so Go changes need a PWA build too (the
    # image test checks that GET / serves it)
    if: needs.changes.outputs.pwa == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter termote...

      # Audits the whole workspace lockfile (pnpm audit has no --filter)
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type check
        working-directory: pwa
        run: pnpm tsc --noEmit

      - name: Lint
        working-directory: pwa
        run: pnpm lint:ci

      - name: Unit tests
        working-directory: pwa
        run: pnpm test:coverage

      - name: Build
        working-directory: pwa
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-dist
          path: pwa/dist
          retention-days: 7

  # The binary embeds the PWA; without a PWA build (only Go changed) it embeds
  # the placeholder page, which is enough for everything but the image test.
  build-api:
    name: Build server
    runs-on: ubuntu-latest
    needs: [changes, build-pwa]
    if: |
      always() && needs.build-pwa.result != 'failure' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.docker == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Download PWA build
        if: needs.build-pwa.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwa-dist
          path: server/webui/dist

      - name: Build
        working-directory: server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o termote-linux-amd64 .

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termote-linux-amd64
          path: server/termote-linux-amd64
          retention-days: 7

  go-test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.scripts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      # The tmux backend's tests run against a private real tmux server;
      # without tmux they skip.
      - name: Install tmux
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tmux && tmux -V

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test ./...

      - name: Vulnerability check
        if: matrix.os == 'ubuntu-latest'
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Playwright against a real server and tmux. The Chat view specs drive a
  # stand-in Claude Code (tests/fixtures/fake-claude.sh) and a stand-in Codex
  # (tests/fixtures/fake-codex.sh) in windows of the server's own tmux socket;
  # the screenshot spec only refreshes docs images.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pwa == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.scripts == 'true'
    env:
      TERMOTE_NO_AUTH: "true"
      TERMOTE_BIND: 127.0.0.1
      TERMOTE_PORT: "7680"
      TMUX_SESSION: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux && tmux -V

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter termote...

      - name: Install Playwright browser
        working-directory: pwa
        run: pnpm exec playwright install --with-deps chromium

      - name: Build PWA and server
        run: |
          pnpm --filter termote build
          cp -R pwa/dist/. server/webui/dist/
          cd server && CGO_ENABLED=0 go build -o termote-dev .

      # No saved config here, so the server reads TERMOTE_* from the
      # environment; XDG_CONFIG_HOME keeps it that way on any runner.
      # XDG_CACHE_HOME keeps the image uploads in the run's own dir.
      - name: Start server
        run: |
          echo "TMUX_SOCKET=$RUNNER_TEMP/tmux.sock" >> "$GITHUB_ENV"
          XDG_CONFIG_HOME="$RUNNER_TEMP/xdg" XDG_CACHE_HOME="$RUNNER_TEMP/cache" TMUX_SOCKET="$RUNNER_TEMP/tmux.sock" \
            nohup ./server/termote-dev serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            # The first snapshot also creates the server's tmux session
            curl -fsS "http://localhost:$TERMOTE_PORT/api/mux/snapshot" > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"
          exit 1

      # One worker: the specs share one tmux, and a spec that switches its
      # active window would move the others' tabs.
      - name: Run Playwright
        working-directory: pwa
        run: pnpm exec playwright test --workers=1 --grep-invert "Capture screenshots"

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/serve.log"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: pwa/test-results
          retention-days: 7

  # Worktree workspaces against a real Herdr (#355): a headless Herdr 0.9.3 on
  # its own socket, HOME and XDG dirs, a throwaway repo, and the server with
  # --mux herdr. worktrees.spec.ts runs only with TERMOTE_E2E_HERDR=1, and
  # fails there (never skips) when caps.worktrees is off.
  e2e-herdr:
    name: E2E (Herdr worktrees)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pwa == 'true' || needs.changes.outputs.api == 'true'
    env:
      TERMOTE_NO_AUTH: "true"
      TERMOTE_HERDR_ALLOW_NO_AUTH: "true"
      TERMOTE_MUX: herdr
      TERMOTE_BIND: 127.0.0.1
      TERMOTE_PORT: "7680"
      HERDR_VERSION: v0.9.3
      HERDR_SHA256: 18a8dc65f1c2fa485884344356dea1cfd911c6f06cf46fa78e193f4087f4dba7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A failed download or a checksum mismatch fails the job.
      - name: Install Herdr
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/$HERDR_VERSION/herdr-linux-x86_64"
          echo "$HERDR_SHA256  $RUNNER_TEMP/bin/herdr" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/herdr"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter termote...

      - name: Install Playwright browser
        working-directory: pwa
        run: pnpm exec playwright install --with-deps chromium

      - name: Build PWA and server
        run: |
          pnpm --filter termote build
          cp -R pwa/dist/. server/webui/dist/
          cd server && CGO_ENABLED=0 go build -o termote-dev .

      # Everything Herdr and the server write stays under $RUNNER_TEMP/herdr
      # (HOME and XDG only for this step: Playwright's browsers live in the
      # runner's own HOME); the server runs without a saved config, so it
      # reads TERMOTE_*.
      - name: Start Herdr, a repo and the server
        run: |
          H="$RUNNER_TEMP/herdr"
          mkdir -p "$H/home" "$H/config" "$H/state" "$H/cache"
          {
            echo "HERDR_SOCKET_PATH=$H/herdr.sock"
            echo "TERMOTE_E2E_REPO=$H/repo"
          } >> "$GITHUB_ENV"
          export HOME="$H/home" XDG_CONFIG_HOME="$H/config" XDG_STATE_HOME="$H/state" \
            XDG_CACHE_HOME="$H/cache" HERDR_SOCKET_PATH="$H/herdr.sock"
          nohup herdr server > "$H/herdr.log" 2>&1 &
          for _ in $(seq 1 30); do herdr api snapshot > /dev/null 2>&1 && break; sleep 1; done
          herdr api snapshot > /dev/null
          git init -q -b main "$H/repo"
          git -C "$H/repo" -c user.name=e2e -c user.email=e2e@example.com commit -q --allow-empty -m init
          git -C "$H/repo" branch e2e-base
          herdr workspace create --cwd "$H/repo" --label e2e-repo --no-focus
          nohup ./server/termote-dev serve > "$H/serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -H 'Sec-Fetch-Site: same-origin' "http://localhost:$TERMOTE_PORT/api/mux/snapshot" |
              grep -q '"worktrees":true' && exit 0
            sleep 1
          done
          cat "$H/serve.log"
          exit 1

      - name: Run Playwright
        working-directory: pwa
        env:
          TERMOTE_E2E_HERDR: "1"
        run: pnpm exec playwright test worktrees --workers=1

      - name: Stop Herdr
        if: always()
        run: herdr server stop || true

      - name: Logs
        if: failure()
        run: cat "$RUNNER_TEMP/herdr/serve.log" "$RUNNER_TEMP/herdr/herdr.log"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-herdr
          path: pwa/test-results
          retention-days: 7

  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    needs: changes
    # The shim tests also run the real CLI, so Go changes count too
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shim tests build a stand-in binary and the real CLI with Go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Run CLI shim tests
        run: ./tests/test-termote.sh

      - name: Run online installer tests
        run: ./tests/test-install.sh

      - name: Run entrypoint tests
        run: ./tests/test-entrypoints.sh

      - name: Run Herdr plugin launcher tests
        run: ./tests/test-herdr-plugin.sh

  # install.sh is POSIX sh; macOS has BSD tools and shasum.
  test-install-macos:
    name: Test installer (macOS)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Run online installer tests
        run: ./tests/test-install.sh

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Build termote.exe
        working-directory: server
        run: go build -ldflags="-s -w" -o termote.exe .

      - name: Verify binary
        shell: pwsh
        run: |
          if (Test-Path server/termote.exe) {
            Write-Host "termote.exe built successfully" -ForegroundColor Green
          } else {
            throw "Build failed"
          }

      # The agent lookup on Windows (Codex rollout from the handle table,
      # process hooks, agent start); the rest of the suite runs on Linux.
      - name: Run Windows agent tests
        working-directory: server
        run: go test -count=1 -run 'Agent|Codex|SysHandle|ProcWriteFiles|RolloutIdentity|WinDrivePath|WindowsProcHooks' .

      # Syntax is checked inside both test scripts
      - name: Run shim tests
        shell: pwsh
        run: ./tests/test-termote.ps1

      - name: Run online installer tests
        shell: pwsh
        run: ./tests/test-install.ps1

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [changes, build-pwa, build-api]
    if: |
      always() &&
      needs.build-pwa.result == 'success' &&
      needs.build-api.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download server binary
        if: needs.build-api.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termote-linux-amd64
          path: server

      - name: Create .htpasswd
        run: echo 'termote:$apr1$dummy$hash' > .htpasswd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: termote:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container runtime (tini, zombies, stop time)
        run: TERMOTE_TEST_IMAGE=termote:test ./tests/test-entrypoints.sh

  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.website == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @termote/website...

      - name: Build
        working-directory: website
        run: pnpm build

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting (dprint)
        run: npx --yes dprint@0.60.1 check

  # Secrets in any commit of the history, not only the files at HEAD. A known
  # test fixture is listed by fingerprint in .gitleaksignore.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (sha256 pinned)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'
