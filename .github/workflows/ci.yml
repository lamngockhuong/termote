name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      pwa: ${{ steps.filter.outputs.pwa }}
      api: ${{ steps.filter.outputs.api }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docker: ${{ steps.filter.outputs.docker }}
      website: ${{ steps.filter.outputs.website }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workspace: &workspace
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            pwa:
              - *workspace
              - 'pwa/**'
            api:
              - 'server/**'
            scripts:
              - 'scripts/**'
              - 'tests/**'
              - 'herdr-plugin/**'
              - 'Makefile'
              - 'entrypoint.sh'
            docker:
              - 'Dockerfile'
              - 'entrypoint.sh'
              - 'docker-compose.yml'
            website:
              - *workspace
              - 'website/**'
            docs:
              - 'docs/**'
              - 'dprint.json'

  build-pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    needs: changes
    # The binary embeds the PWA, so Go changes need a PWA build too (the
    # image test checks that GET / serves it)
    if: needs.changes.outputs.pwa == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter termote...

      # Audits the whole workspace lockfile (pnpm audit has no --filter)
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type check
        working-directory: pwa
        run: pnpm tsc --noEmit

      - name: Lint
        working-directory: pwa
        run: pnpm lint:ci

      - name: Unit tests
        working-directory: pwa
        run: pnpm test:coverage

      - name: Build
        working-directory: pwa
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pwa-dist
          path: pwa/dist
          retention-days: 7

  # The binary embeds the PWA; without a PWA build (only Go changed) it embeds
  # the placeholder page, which is enough for everything but the image test.
  build-api:
    name: Build server
    runs-on: ubuntu-latest
    needs: [changes, build-pwa]
    if: |
      always() && needs.build-pwa.result != 'failure' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.docker == 'true')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Download PWA build
        if: needs.build-pwa.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: pwa-dist
          path: server/webui/dist

      - name: Build
        working-directory: server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o termote-linux-amd64 .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: termote-linux-amd64
          path: server/termote-linux-amd64
          retention-days: 7

  go-test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.scripts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test ./...

      - name: Vulnerability check
        if: matrix.os == 'ubuntu-latest'
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Playwright against a real server and tmux. The Chat view specs drive a
  # stand-in Claude Code (tests/fixtures/fake-claude.sh) and a stand-in Codex
  # (tests/fixtures/fake-codex.sh) in windows of the server's own tmux socket;
  # the screenshot spec only refreshes docs images.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pwa == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.scripts == 'true'
    env:
      TERMOTE_NO_AUTH: "true"
      TERMOTE_BIND: 127.0.0.1
      TERMOTE_PORT: "7680"
      TMUX_SESSION: e2e
    steps:
      - uses: actions/checkout@v7

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux && tmux -V

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter termote...

      - name: Install Playwright browser
        working-directory: pwa
        run: pnpm exec playwright install --with-deps chromium

      - name: Build PWA and server
        run: |
          pnpm --filter termote build
          cp -R pwa/dist/. server/webui/dist/
          cd server && CGO_ENABLED=0 go build -o termote-dev .

      # No saved config here, so the server reads TERMOTE_* from the
      # environment; XDG_CONFIG_HOME keeps it that way on any runner.
      # XDG_CACHE_HOME keeps the image uploads in the run's own dir.
      - name: Start server
        run: |
          echo "TMUX_SOCKET=$RUNNER_TEMP/tmux.sock" >> "$GITHUB_ENV"
          XDG_CONFIG_HOME="$RUNNER_TEMP/xdg" XDG_CACHE_HOME="$RUNNER_TEMP/cache" TMUX_SOCKET="$RUNNER_TEMP/tmux.sock" \
            nohup ./server/termote-dev serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            # The first snapshot also creates the server's tmux session
            curl -fsS "http://localhost:$TERMOTE_PORT/api/mux/snapshot" > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"
          exit 1

      # One worker: the specs share one tmux, and a spec that switches its
      # active window would move the others' tabs.
      - name: Run Playwright
        working-directory: pwa
        run: pnpm exec playwright test --workers=1 --grep-invert "Capture screenshots"

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/serve.log"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: pwa/test-results
          retention-days: 7

  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    needs: changes
    # The shim tests also run the real CLI, so Go changes count too
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7

      # The shim tests build a stand-in binary and the real CLI with Go
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Run CLI shim tests
        run: ./tests/test-termote.sh

      - name: Run online installer tests
        run: ./tests/test-install.sh

      - name: Run entrypoint tests
        run: ./tests/test-entrypoints.sh

      - name: Run Herdr plugin launcher tests
        run: ./tests/test-herdr-plugin.sh

  # install.sh is POSIX sh; macOS has BSD tools and shasum.
  test-install-macos:
    name: Test installer (macOS)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Run online installer tests
        run: ./tests/test-install.sh

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: server/go.mod

      - name: Build termote.exe
        working-directory: server
        run: go build -ldflags="-s -w" -o termote.exe .

      - name: Verify binary
        shell: pwsh
        run: |
          if (Test-Path server/termote.exe) {
            Write-Host "termote.exe built successfully" -ForegroundColor Green
          } else {
            throw "Build failed"
          }

      # Syntax is checked inside both test scripts
      - name: Run shim tests
        shell: pwsh
        run: ./tests/test-termote.ps1

      - name: Run online installer tests
        shell: pwsh
        run: ./tests/test-install.ps1

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [changes, build-pwa, build-api]
    if: |
      always() &&
      needs.build-pwa.result == 'success' &&
      needs.build-api.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Download server binary
        if: needs.build-api.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: termote-linux-amd64
          path: server

      - name: Create .htpasswd
        run: echo 'termote:$apr1$dummy$hash' > .htpasswd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: termote:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container runtime (tini, zombies, stop time)
        run: TERMOTE_TEST_IMAGE=termote:test ./tests/test-entrypoints.sh

  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.website == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @termote/website...

      - name: Build
        working-directory: website
        run: pnpm build

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting (dprint)
        run: npx dprint check
