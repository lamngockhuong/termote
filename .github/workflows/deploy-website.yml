name: Deploy Website

# Deploys only with a stable release (called from release.yml) or by
# hand from a release tag, not on every push to main: main runs ahead of the
# latest release, and the site's docs and its install.sh/install.ps1 must be
# the ones of the version people install.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build the site from (vX.Y.Z)"
        required: true
        type: string
  workflow_dispatch:

# Only the deploy job may publish: build runs the site's dependencies, and
# deploy, which runs none, makes the Pages artifact with the tag's installers
# and agent guide.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # By hand, the run must be started on a release tag (Use workflow
      # from: tags/vX.Y.Z), never a branch.
      - name: Check the ref is a release tag
        env:
          TAG: ${{ inputs.tag || github.ref }}
        run: |
          case "${TAG#refs/tags/}" in
            *-*) echo "::error::'$TAG' is a pre-release; the site follows stable releases only"; exit 1 ;;
            v[0-9]*.[0-9]*.[0-9]*) echo "Deploying ${TAG#refs/tags/}" ;;
            *) echo "::error::deploy only from a release tag (vX.Y.Z), not '$TAG'"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The whole history: each page's "last updated" date and its sitemap
          # lastmod come from the last commit to its source
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0

      # No cache: called from a release run, it shares the cache
      # any CI job on main can write.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      # The PWA's too: the site publishes the interactive demo
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @termote/website... --filter termote...

      - name: Build
        run: pnpm build
        working-directory: website

      # The PWA of the tag, built in its demo mode (pwa/src/demo): no server,
      # served at /demo/
      - name: Build the demo
        run: |
          pnpm --filter termote build:demo
          cp -R pwa/dist-demo website/dist/demo

      # The installers people pipe into a shell must be the tag's, byte for
      # byte, before anything is published (verify checks the served ones).
      - name: Check the built installers
        run: |
          for f in install.sh install.ps1; do
            git show "HEAD:scripts/$f" | cmp - "website/dist/$f" ||
              { echo "::error::website/dist/$f differs from scripts/$f in the tag"; exit 1; }
          done

      # Not the Pages artifact yet: a process the build's dependencies left
      # running could still rewrite dist after the check above. deploy
      # makes the Pages artifact in a job that runs none of their code.
      - name: Upload the built site
        id: site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: website/dist
          retention-days: 1
          if-no-files-found: error

      - name: Name the site artifact's id
        id: artifact
        env:
          ID: ${{ steps.site.outputs.artifact-id }}
        run: |
          case "$ID" in ''|*[!0-9]*) echo "::error::no artifact id from the upload"; exit 1 ;; esac
          echo "site=$ID" >> "$GITHUB_OUTPUT"
    outputs:
      site: ${{ steps.artifact.outputs.site }}

  # The Pages artifact is made and deployed in this one job, after the
  # environment's approval and with no wait between the two: the files people
  # pipe into a shell or hand to a coding agent are copied from the tag over
  # whatever the build left, and checked byte for byte once more. The built
  # site is downloaded by id, so one deleted and uploaded again under its name
  # (with a runtime token a build dependency took) is not the one read; no
  # code of a dependency runs here.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the files taken from the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          # The sources check-site-installs.mjs reads (its SOURCES): keep
          # the two lists alike.
          sparse-checkout: |
            scripts
            server/agent-guide.md
            website/llms.txt
            website/llms-full.txt
            website/llms-small.txt
            website/astro.config.mjs
            website/src
            website/public
          path: src

      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.site }}
          path: site

      # llms-full.txt and llms-small.txt are committed as the tag's docs
      # build to: a tag whose committed ones are stale fails here rather than
      # serving them (the copy below would only compare them with themselves).
      - name: Check the tag's llms files are what its docs build to
        run: |
          for f in llms-full.txt llms-small.txt; do
            cmp "src/website/$f" "site/$f" || {
              echo "::error::website/$f is not what the tag's docs build to: run make llms"; exit 1; }
          done

      # The agent guide is what llms.txt and the install docs tell a coding
      # agent to follow, with the install commands in it; llms.txt is what
      # sends a coding agent there, and llms-full.txt and llms-small.txt are
      # the docs it reads as text (committed with `make llms`).
      - name: Put the tag's installers, agent guide and llms files in
        run: |
          for pair in scripts/install.sh:install.sh scripts/install.ps1:install.ps1 server/agent-guide.md:agents.md website/llms.txt:llms.txt website/llms-full.txt:llms-full.txt website/llms-small.txt:llms-small.txt; do
            from="src/${pair%%:*}" to="site/${pair#*:}"
            cp "$from" "$to"
            cmp "$from" "$to"
          done

      # Every other page was written by the build's dependencies: each line
      # of code must be one of the tag's sources (src), a download into a
      # shell in prose may name only this project's own addresses, and each
      # link to an install script, the agent guide or an llms file must be
      # one of this project's own files. The tag's check, run by the
      # runner's own node.
      - name: Check the site's install commands
        run: node src/scripts/check-site-installs.mjs site src

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The installers people pipe into a shell, the guide a coding agent
  # follows and the llms.txt that sends it there must be byte for byte the
  # ones in the tag, served as text (not an HTML error page).
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the served installers, agent guide and llms files
        run: |
          for pair in scripts/install.sh:install.sh scripts/install.ps1:install.ps1 server/agent-guide.md:agents.md website/llms.txt:llms.txt website/llms-full.txt:llms-full.txt website/llms-small.txt:llms-small.txt; do
            src=${pair%%:*} url="https://termote.ohnice.app/${pair#*:}"
            # The Pages CDN may keep the old file for up to 10 minutes.
            for i in $(seq 1 24); do
              curl -fsSL -H 'Cache-Control: no-cache' -D headers.txt -o served "$url?deploy=${GITHUB_RUN_ID}" &&
                cmp -s served "$src" && break
              echo "waiting for $url to serve the new file..."; sleep 30
            done
            cmp served "$src" || { echo "::error::$url differs from $src"; exit 1; }
            grep -qi '^content-type: *\(text/\|application/octet-stream\|application/x-sh\)' headers.txt ||
              { echo "::error::$url is not served as text: $(grep -i '^content-type' headers.txt)"; exit 1; }
          done
