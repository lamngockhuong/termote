# Termote Docker Compose, for development from a checkout:
#   make build-api && cp server/termote server/termote-linux-$(go env GOARCH)
#   docker compose --profile docker up --build
# Installed releases run the published image with: termote container up
# All-in-one container (tmux or herdr + termote); tini is PID 1 in the image.
# TERMOTE_MUX=herdr docker compose --profile docker up picks the herdr backend.

services:
  termote:
    build: .
    container_name: termote
    profiles: [docker]
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    ports:
      - "127.0.0.1:7680:7680"
    volumes:
      - ${WORKSPACE:-./workspace}:/workspace:rw
    working_dir: /workspace
    environment:
      - NO_AUTH=${NO_AUTH:-false}
      - TERMOTE_PASS=${TERMOTE_PASS:-}
      - TERMOTE_ALLOWED_HOSTS=${TERMOTE_ALLOWED_HOSTS:-}
      - TERMOTE_MUX=${TERMOTE_MUX:-tmux}
      - TERMOTE_HERDR_ALLOW_NO_AUTH=${TERMOTE_HERDR_ALLOW_NO_AUTH:-false}
    restart: unless-stopped
